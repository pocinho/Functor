# cargo-deny configuration. See docs/architecture/dependency-policy.md.

[advisories]
version = 2

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # Public-domain dedication; `notify` (filesystem notifications for `watch`) uses it.
    "CC0-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path dependencies carry no version; they are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
