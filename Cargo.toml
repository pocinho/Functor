[workspace]
resolver = "3"
members = ["src/crates/*", "src/app/cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.99"
# No crate is published until an ADR decides otherwise.
publish = false

[workspace.dependencies]
functor-model = { path = "src/crates/functor-model" }
functor-core = { path = "src/crates/functor-core" }
functor-repository = { path = "src/crates/functor-repository" }
functor-store = { path = "src/crates/functor-store" }
functor-query = { path = "src/crates/functor-query" }
functor-validation = { path = "src/crates/functor-validation" }
functor-events = { path = "src/crates/functor-events" }
functor-testkit = { path = "src/crates/functor-testkit" }

clap = { version = "4", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
thiserror = "2"
ulid = "1"
proptest = "1"
assert_cmd = "2"
predicates = "3"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
dbg_macro = "deny"
# Library crates never print; the CLI crate opts out in its own source.
print_stdout = "deny"
print_stderr = "deny"
