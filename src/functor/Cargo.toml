[package]
name = "functor"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
functor_core = { path = "../functor_core" }
ignore = "0.4"
rfd = "0.15.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
windows-sys = { version = "0.61.2", features = ["Win32_Storage_FileSystem"] }
