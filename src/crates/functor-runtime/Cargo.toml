[package]
name = "functor-runtime"
description = "Functor execution runtime: the bounded local-process provider."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
# A deterministic helper program for the provider's real-process tests; not part of the product.
name = "runtime-fixture"
path = "fixture/main.rs"
test = false
doc = false

[dependencies]
functor-core.workspace = true
functor-model.workspace = true
async-trait.workspace = true
tokio.workspace = true
sha2.workspace = true
toml_edit.workspace = true
process-wrap = { workspace = true, features = ["std", "job-object", "process-group"] }

[dev-dependencies]
functor-testkit.workspace = true
functor-store.workspace = true
functor-repository.workspace = true
functor-events.workspace = true
functor-validation.workspace = true
functor-query.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "time"] }
