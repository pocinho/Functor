[package]
name = "functor-cli"
description = "The functor command line interface."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "functor"
path = "src/main.rs"

# Golden tests need deterministic time and ids, which exist only with the `test-support` feature.
[[test]]
name = "artifact"
required-features = ["test-support"]

[features]
# Test-only environment variables (FUNCTOR_TEST_FIXED_TIME, FUNCTOR_TEST_ID_SEED). Never enabled
# in release builds.
test-support = []

[lints]
workspace = true

[dependencies]
functor-model.workspace = true
functor-core.workspace = true
functor-repository.workspace = true
functor-store.workspace = true
functor-query.workspace = true
functor-validation.workspace = true
functor-events.workspace = true
clap.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
functor-testkit.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
tempfile.workspace = true
serde_json.workspace = true
insta.workspace = true
jsonschema.workspace = true
tokio = { workspace = true, features = ["macros"] }
